# Tests on a Mac (Apple Silicon runner) and on Linux (CPU only). The GitHub macOS runners are
# virtual machines without GPU access, so MPS-only checks skip themselves there; the CPU paths,
# the GUI logic and the whole pipeline on a tiny model all run.
name: CI
on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # torch and torchvision must come from the same index: spandrel needs torchvision, and a PyPI
          # torchvision next to a CPU-index torch fails with "operator torchvision::nms does not exist"
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch torchvision
          fi
          pip install spandrel pillow numpy tifffile
      - name: Tests (engine, colour, batch, preview)
        run: python test_enhance.py
      - name: Tests (interface text, and the Swift files generated from it)
        run: python test_i18n.py
      - name: Tests (face recovery, with stand-ins for Apple Vision and GFPGAN)
        run: python test_faces.py
      - name: Self-test
        run: python enhance.py --selftest

  # The SwiftUI app (Liquid Glass needs the macOS 26 SDK, so this runs on a macos-26 runner): the generated Swift
  # files must be current, the Swift tests must pass (they include a real engine round trip), and the app must build.
  swift:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine's Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision spandrel pillow numpy tifffile
      - name: Generated Swift files are up to date
        run: python packaging/gen_swift.py --check
      - name: Swift tests (with this checkout's Python as the engine)
        run: |
          export MAC_IMAGE_ENHANCER_ENGINE="$(which python)|$PWD/enhance.py"
          cd app && swift test
      - name: Build the app
        run: cd app && swift build -c release
