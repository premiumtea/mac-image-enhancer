# Starts the window on a Mac runner (which has a display) and takes screenshots of its main
# states, so the layout can be looked at without a Mac at hand. Run it by hand: Actions >
# Screenshots > Run workflow, then download the "screenshots" artifact.
name: Screenshots
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision spandrel pillow numpy tifffile
      - name: Fetch the model files (checked against their SHA-256)
        run: python enhance.py --download-models all
      - name: Screenshots, light
        run: python packaging/screenshots.py shots
      - name: Screenshots, dark
        continue-on-error: true
        run: |
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true'
          sleep 3
          python packaging/screenshots.py shots --suffix _dark
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
