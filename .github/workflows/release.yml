# Builds the .app and .dmg when a version tag is pushed (git tag v0.1.0 && git push --tags).
# NOT RUN YET: written alongside packaging/build_app.sh, which has been run locally, but
# this workflow has not run on GitHub. The app is ad-hoc signed only. For a signed and
# notarized release, add the Developer ID certificate and notarytool steps here.
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the python.org build ships with Tcl/Tk, which the app bundles
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch spandrel pillow numpy tifffile pyinstaller
      - name: Build
        run: PYTHON=python ./packaging/build_app.sh
      - name: Check the built app runs
        run: "dist/Mac\\ Enhancer.app/Contents/MacOS/mac-enhancer-gui --selftest"
      - name: Checksum
        run: shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
