# Builds the .app and .dmg. Two ways to run it:
#  - push a version tag (git tag v0.1.0 && git push --tags): builds, then publishes a GitHub release
#  - Actions > Release > Run workflow: builds and checks only; the .dmg and a screenshot of the built
#    app come back as the "release-build" artifact, nothing is published
# The app is ad-hoc signed only. For a signed and notarized release, add the Developer ID
# certificate and notarytool steps here (see README: "The .app and .dmg").
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the python.org build ships with Tcl/Tk, which the app bundles
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision spandrel pillow numpy tifffile pyinstaller pyobjc-framework-Vision
      - name: Build
        run: PYTHON=python ./packaging/build_app.sh
      - name: Check the built app runs
        run: "dist/Mac\\ Image\\ Enhancer.app/Contents/MacOS/mac-image-enhancer-gui --selftest"
      - name: Look at the built app (start it as a user would, take a screenshot)
        run: |
          mkdir -p shots
          open "dist/Mac Image Enhancer.app"
          sleep 30
          screencapture -x shots/built-app.png
          pkill -f mac-image-enhancer-gui || true
      - name: Checksum
        run: shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            shots/*.png
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
