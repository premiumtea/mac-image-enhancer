# Builds "Mac Image Enhancer.app" (the SwiftUI window with the Python engine inside it) and a .dmg. Two ways to run it:
#  - push a version tag (git tag v0.1.1 && git push --tags): builds, then publishes a GitHub release
#    (the notes are packaging/release_notes.md, with __VERSION__ filled in)
#  - Actions > Release > Run workflow: builds and checks only; the .dmg and a screenshot of the built app come back
#    as the "release-build" artifact, nothing is published
# macOS 26 runner: the Liquid Glass APIs need the Xcode 26 SDK (the app still runs on macOS 13 and later, with frosted
# material instead of glass). The app is ad-hoc signed only. For a signed and notarized release, add the Developer ID
# certificate and notarytool steps here (see README: "The .app and .dmg").
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAVE_APPLE_SECRETS: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_SIGN_IDENTITY != '' && secrets.NOTARY_APP_PASSWORD != '' }}
    permissions:
      contents: write   # to create the release (a repository's default token is read-only)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision spandrel pillow numpy tifffile pyinstaller coremltools pyobjc-framework-Vision pyobjc-framework-Quartz
      # Signing and notarization run only when the repository has the Apple secrets (see README: "The .app and .dmg");
      # without them the build is ad hoc signed, as v0.1.x were. UNTESTED: written without a Developer ID.
      - name: Import the Developer ID certificate and notary credentials
        if: env.HAVE_APPLE_SECRETS == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          xcrun notarytool store-credentials mie-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PASSWORD"
          echo "SIGN_ID=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=mie-notary" >> "$GITHUB_ENV"
      - name: Build
        run: PYTHON=python ./packaging/build_swift_app.sh
      - name: Check the engine inside the app runs
        run: "dist/Mac\\ Image\\ Enhancer.app/Contents/Resources/engine/mac-image-enhancer-engine --selftest"
      - name: Look at the built app (start it as a user would, take a screenshot)
        run: |
          mkdir -p shots
          python packaging/sample_picture.py shots-input.jpg
          export MAC_IMAGE_ENHANCER_MODELS="$PWD/models"   # where the bundled engine looks for the model files fetched here
          python enhance.py --download-models photo
          # the real thing: the app finds its bundled engine
          python packaging/screenshots_app.py "dist/Mac Image Enhancer.app" shots "$PWD/shots-input.jpg"
      - name: Checksum
        run: cd dist && shasum -a 256 *.dmg | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-build
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            shots/*.png
            shots/*.log
      - name: Release notes for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: sed "s/__VERSION__/${GITHUB_REF_NAME#v}/g" packaging/release_notes.md > release-body.md
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Mac Image Enhancer ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
