# Throwaway probe: which macOS / Xcode do the hosted runners have? (delete after use)
name: Toolcheck
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
          ls /Applications | grep -i xcode || true
